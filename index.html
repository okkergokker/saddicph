<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>saddi</title>
<meta name="description" content="saddi. Something is cooking. Stay tuned.">
<meta name="theme-color" content="#f6e29a">
<style>html,body{background:#f6e29a}</style>
<link rel="preload" href="logo.png?v=2" as="image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --wall: #f6e29a;
    --hint: rgba(107, 28, 35, .72);
    --ink: #6b1c23;
    --ink-soft: rgba(107, 28, 35, .78);
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--wall); overscroll-behavior: none; }
  body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--wall);
    color: var(--hint);
    font-family: "Averia Serif Libre", Palatino, "Palatino Linotype", Georgia, serif;
    font-style: normal;
  }

  .wall {
    position: fixed;
    inset: 0;
    background: var(--wall);
    pointer-events: none;
  }

  .content {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 45%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: calc(env(safe-area-inset-top, 0px) + 32px) 24px calc(env(safe-area-inset-bottom, 0px) + 32px) clamp(28px, 7vw, 120px);
    color: var(--ink);
    z-index: 2;
  }
  .content h1 {
    margin: 0 0 clamp(20px, 3.5vh, 36px);
    line-height: 0;
  }
  .content h1 img {
    display: block;
    width: min(100%, 28vw, 420px);
    height: auto;
    -webkit-user-select: none;
    user-select: none;
  }
  .content .lead {
    margin: 0 0 .5em;
    font-size: clamp(22px, 2.3vw, 36px);
    line-height: 1.25;
  }
  .content .sub {
    margin: 0 0 clamp(20px, 3.5vh, 36px);
    max-width: 100%;
    font-size: clamp(16px, 1.3vw, 20px);
    line-height: 1.5;
    color: var(--ink-soft);
  }
  .content .tune {
    margin: 0;
    font-size: clamp(16px, 1.3vw, 20px);
    letter-spacing: .02em;
    color: var(--ink-soft);
  }

  canvas#scene {
    position: fixed;
    top: 0;
    right: 0;
    width: 55%;
    height: 100%;
    display: block;
    touch-action: auto;
    outline: none;
    background: var(--wall);
  }

  html.phone canvas#scene { display: none; }
  html.phone .content {
    width: 100%;
    height: 100%;
    justify-content: center;
    padding: calc(env(safe-area-inset-top, 0px) + 32px) 28px calc(env(safe-area-inset-bottom, 0px) + 32px);
  }
  html.phone .content h1 { margin-bottom: 14px; }
  html.phone .content h1 img { width: min(78vw, 280px); }
  html.phone .content .lead { font-size: 20px; }
  html.phone .content .sub { font-size: 15px; margin-bottom: 12px; }
  html.phone .content .tune { font-size: 15px; }
  @media (max-width: 760px) {
    canvas#scene { display: none; }
    .content {
      width: 100%;
      height: 100%;
      justify-content: center;
      padding: calc(env(safe-area-inset-top, 0px) + 32px) 28px calc(env(safe-area-inset-bottom, 0px) + 32px);
    }
    .content h1 { margin-bottom: 14px; }
    .content h1 img { width: min(78vw, 280px); }
    .content .lead { font-size: 20px; }
    .content .sub { font-size: 15px; margin-bottom: 12px; }
    .content .tune { font-size: 15px; }
  }

  .hint {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    margin: 0;
    padding: 0 24px calc(env(safe-area-inset-bottom, 0px) + 30px);
    text-align: center;
    font-size: 16px;
    line-height: 1.45;
    letter-spacing: .01em;
    pointer-events: none;
    transition: opacity 2.4s ease;
  }
  .hint.gone { opacity: 0; }

  .content, canvas#scene { opacity: 0; transition: opacity .35s ease; }
  .ready .content, .ready canvas#scene { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .hint { transition: none; }
    .content, canvas#scene { transition: none; }
  }
</style>
<noscript><style>.content, canvas#scene { opacity: 1; }</style></noscript>
</head>
<body>
  <div class="wall" aria-hidden="true"></div>
  <main class="content">
    <h1><img src="logo.png?v=2" alt="Saddi" width="895" height="312"></h1>
    <p class="lead">Something is cooking.</p>
    <p class="sub">But we're keeping things under wraps a little longer.</p>
    <p class="tune">Stay tuned.</p>
  </main>
  <canvas id="scene" role="img" aria-label="A linen tea towel hanging from a chrome clip and leather cord on a nail, swaying in a light breeze"></canvas>
  <p class="hint" id="hint" role="status"></p>

<script>
(function () {
  'use strict';

  const hint = document.getElementById('hint');
  const canvas = document.getElementById('scene');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const PHONE = Math.min(window.innerWidth, window.innerHeight) <= 900
    && (window.matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 1);

  const reveal = () => document.documentElement.classList.add('ready');
  const fontsReady = (document.fonts && document.fonts.ready)
    ? Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 2500))])
    : Promise.resolve();

  if (PHONE) {
    document.documentElement.classList.add('phone');
    reveal();
    return;
  }

  function boot() {
  if (typeof THREE === 'undefined') {
    hint.textContent = 'The animation could not be loaded. Reload the page to try again.';
    hint.classList.remove('gone');
    fontsReady.then(reveal);
    return;
  }

  const TOWEL = {
    linen:  '#d3bd99',
    stripe: '#3f5274',
  };

  const CALM = reduceMotion ? 0.45 : 1;
  const SX = 32, SY = 44;
  const COLS = SX + 1, ROWS = SY + 1, N = COLS * ROWS;
  const W = 3.6, REST = W / SX, H = SY * REST;
  const HOOK_Y = 3.45;
  const LOOP_L = 0.56;
  const WALL_Z = -0.25;
  const HOOK_Z = WALL_Z + 0.13;
  const G = -23;
  const AIR = 0.95;
  const DAMP = 0.994;
  const SUB = 1 / 120;
  const MAX_SUB = 3;
  const ITER = 7;
  const TOP = HOOK_Y - LOOP_L;
  const MID = SX / 2;

  const pos = new Float32Array(N * 3);
  const prev = new Float32Array(N * 3);
  const acc = new Float32Array(N * 3);
  const ext = new Float32Array(N * 3);
  const invMass = new Float32Array(N).fill(1);
  const I = (i, j) => j * COLS + i;

  for (let j = 0; j < ROWS; j++) {
    for (let i = 0; i < COLS; i++) {
      const k = I(i, j) * 3;
      pos[k] = (i - MID) * REST;
      pos[k + 1] = TOP - j * REST;
      pos[k + 2] = 0;
    }
  }

  const cons = [];
  function link(a, b, k) {
    const ax = a * 3, bx = b * 3;
    const dx = pos[bx] - pos[ax], dy = pos[bx + 1] - pos[ax + 1], dz = pos[bx + 2] - pos[ax + 2];
    cons.push(a, b, Math.sqrt(dx * dx + dy * dy + dz * dz), k);
  }
  for (let j = 0; j < ROWS; j++) {
    for (let i = 0; i < COLS; i++) {
      if (i < SX) link(I(i, j), I(i + 1, j), 1);
      if (j < SY) link(I(i, j), I(i, j + 1), 1);
      if (i < SX && j < SY) {
        link(I(i, j), I(i + 1, j + 1), 1);
        link(I(i + 1, j), I(i, j + 1), 1);
      }
      if (i < SX - 1) link(I(i, j), I(i + 2, j), 1);
      if (j < SY - 1) link(I(i, j), I(i, j + 2), 1);
      if (i < SX - 1 && j < SY - 1) { link(I(i, j), I(i + 2, j + 2), 0.6); link(I(i + 2, j), I(i, j + 2), 0.6); }
      if (i < SX - 3) link(I(i, j), I(i + 4, j), 0.4);
      if (j < SY - 3) link(I(i, j), I(i, j + 4), 0.4);
    }
  }
  const NC = cons.length / 4;
  const CA = new Int32Array(NC), CB = new Int32Array(NC);
  const CR = new Float32Array(NC), CK = new Float32Array(NC);
  for (let c = 0; c < NC; c++) {
    CA[c] = cons[c * 4]; CB[c] = cons[c * 4 + 1]; CR[c] = cons[c * 4 + 2]; CK[c] = cons[c * 4 + 3];
  }

  for (let j = 0; j < ROWS; j++) {
    for (let i = 0; i < COLS; i++) pos[I(i, j) * 3 + 2] = HOOK_Z + Math.sin(i * 1.7 + j * 0.9) * 0.01;
  }
  prev.set(pos);

  const tris = [];
  for (let j = 0; j < SY; j++) {
    for (let i = 0; i < SX; i++) {
      const a = I(i, j), b = I(i + 1, j), c = I(i, j + 1), d = I(i + 1, j + 1);
      tris.push(a, c, b, b, c, d);
    }
  }
  const TRI = new Uint32Array(tris);

  const PINS = [
    [I(MID, 0), 0, 0],
    [I(MID - 1, 0), -0.045, -0.02], [I(MID + 1, 0), 0.045, -0.02],
    [I(MID - 2, 0), -0.08, -0.05], [I(MID + 2, 0), 0.08, -0.05],
    [I(MID, 1), 0, -0.075], [I(MID - 1, 1), -0.05, -0.085], [I(MID + 1, 1), 0.05, -0.085],
  ];
  for (const pn of PINS) invMass[pn[0]] = 0;

  const TT = PINS.map(([q]) => {
    const t = new Float32Array(N), qi = q % COLS, qj = Math.floor(q / COLS);
    for (let j = 0; j < ROWS; j++) {
      for (let i = 0; i < COLS; i++) t[I(i, j)] = Math.hypot(i - qi, j - qj) * REST * 1.015;
    }
    return t;
  });

  const COLL_D = REST * 1.05, COLL_D2 = COLL_D * COLL_D, COLL_INV = 1 / COLL_D;
  const HSIZE = 8192, HMASK = HSIZE - 1;
  const cellStart = new Int32Array(HSIZE + 1), cellItems = new Int32Array(N), pCell = new Int32Array(N);
  const GI = new Int16Array(N), GJ = new Int16Array(N);
  for (let p = 0; p < N; p++) { GI[p] = p % COLS; GJ[p] = Math.floor(p / COLS); }
  const hashCell = (x, y, z) => (Math.imul(x, 92837111) ^ Math.imul(y, 689287499) ^ Math.imul(z, 283923481)) & HMASK;

  function selfCollide() {
    cellStart.fill(0);
    for (let p = 0; p < N; p++) {
      const k = p * 3;
      const h = hashCell(Math.floor(pos[k] * COLL_INV), Math.floor(pos[k + 1] * COLL_INV), Math.floor(pos[k + 2] * COLL_INV));
      pCell[p] = h;
      cellStart[h]++;
    }
    let run = 0;
    for (let h = 0; h < HSIZE; h++) { run += cellStart[h]; cellStart[h] = run; }
    cellStart[HSIZE] = run;
    for (let p = 0; p < N; p++) { const h = pCell[p]; cellStart[h]--; cellItems[cellStart[h]] = p; }

    for (let a = 0; a < N; a++) {
      const ka = a * 3;
      const cx = Math.floor(pos[ka] * COLL_INV), cy = Math.floor(pos[ka + 1] * COLL_INV), cz = Math.floor(pos[ka + 2] * COLL_INV);
      const ai = GI[a], aj = GJ[a], wa = invMass[a];
      for (let ox = -1; ox <= 1; ox++) {
        for (let oy = -1; oy <= 1; oy++) {
          for (let oz = -1; oz <= 1; oz++) {
            const h = hashCell(cx + ox, cy + oy, cz + oz);
            for (let q = cellStart[h], qe = cellStart[h + 1]; q < qe; q++) {
              const b = cellItems[q];
              if (b <= a) continue;
              const di = GI[b] - ai, dj = GJ[b] - aj;
              if (di <= 2 && di >= -2 && dj <= 2 && dj >= -2) continue;
              if (Math.abs(ai - MID) + aj <= 5 && Math.abs(GI[b] - MID) + GJ[b] <= 5) continue;
              const kb = b * 3;
              const dx = pos[kb] - pos[ka], dy = pos[kb + 1] - pos[ka + 1], dz = pos[kb + 2] - pos[ka + 2];
              const d2 = dx * dx + dy * dy + dz * dz;
              if (d2 >= COLL_D2 || d2 < 1e-14) continue;
              const wb = invMass[b], ws = wa + wb;
              if (wa === 0 || wb === 0) continue;
              const d = Math.sqrt(d2);
              const c = (COLL_D - d) / (d * ws);
              const sx = dx * c, sy = dy * c, sz = dz * c;
              pos[ka] -= sx * wa; pos[ka + 1] -= sy * wa; pos[ka + 2] -= sz * wa;
              pos[kb] += sx * wb; pos[kb + 1] += sy * wb; pos[kb + 2] += sz * wb;
              prev[ka] -= sx * wa * 0.7; prev[ka + 1] -= sy * wa * 0.7; prev[ka + 2] -= sz * wa * 0.7;
              prev[kb] += sx * wb * 0.7; prev[kb + 1] += sy * wb * 0.7; prev[kb + 2] += sz * wb * 0.7;
            }
          }
        }
      }
    }
  }

  const hang = { x: 0, y: TOP, z: HOOK_Z, dx: 0, dy: -1, dz: 0 };
  function updateHang() {
    let cx = 0, cy = 0, cz = 0, n = 0;
    for (let p = 0; p < N; p += 4) { const k = p * 3; cx += pos[k]; cy += pos[k + 1]; cz += pos[k + 2]; n++; }
    let tx = cx / n, ty = cy / n - HOOK_Y, tz = cz / n - HOOK_Z;
    let l = Math.sqrt(tx * tx + ty * ty + tz * tz) || 1;
    tx /= l; ty /= l; tz /= l;
    const MAXS = 0.57, sh = Math.sqrt(tx * tx + tz * tz);
    if (sh > MAXS || ty > 0) { tx *= MAXS / sh; tz *= MAXS / sh; ty = -Math.sqrt(1 - MAXS * MAXS); }
    hang.dx += (tx - hang.dx) * 0.03; hang.dy += (ty - hang.dy) * 0.03; hang.dz += (tz - hang.dz) * 0.03;
    l = Math.sqrt(hang.dx * hang.dx + hang.dy * hang.dy + hang.dz * hang.dz);
    hang.dx /= l; hang.dy /= l; hang.dz /= l;
    hang.x = hang.dx * LOOP_L; hang.y = HOOK_Y + hang.dy * LOOP_L; hang.z = HOOK_Z + hang.dz * LOOP_L;
  }

  const wind = { x: 0, y: 0, z: 0 };
  function updateWind(t) {
    const idle = (typeof pointer !== 'undefined' && pointer.energy > 0.15) ? 0.55 : 1;
    if (PHONE) {
      const ang = 1.05 + 0.36 * Math.sin(t * 0.42);
      const S = 1.75 * idle;
      wind.x = Math.cos(ang) * S;
      wind.z = Math.sin(ang) * S;
      wind.y = 0.26 * S;
      return;
    }
    const g = (0.6 + CALM * (0.26 * Math.sin(t * 0.23) + 0.13 * Math.sin(t * 0.57 + 1.7) + 0.05 * Math.sin(t * 1.31 + 0.4))) * idle;
    const ang = 0.95 + 0.45 * Math.sin(t * 0.11 + 2.0);
    const S = 3.0 * g;
    wind.x = Math.cos(ang) * S;
    wind.z = Math.sin(ang) * S;
    wind.y = 0.25 * S;
  }

  function pin(p, x, y, z) {
    const k = p * 3;
    prev[k] = pos[k]; prev[k + 1] = pos[k + 1]; prev[k + 2] = pos[k + 2];
    pos[k] = x; pos[k + 1] = y; pos[k + 2] = z;
  }

  function step(t, collide) {
    updateHang();
    updateWind(t);
    const inv = 1 / SUB, A0 = REST * REST * 0.5, dt2 = SUB * SUB;
    const rip = PHONE ? 0.58 : CALM;

    for (let k = 0; k < N * 3; k += 3) {
      acc[k] = ext[k];
      acc[k + 1] = G + ext[k + 1];
      acc[k + 2] = ext[k + 2];
    }

    for (let f = 0; f < TRI.length; f += 3) {
      const a = TRI[f] * 3, b = TRI[f + 1] * 3, c = TRI[f + 2] * 3;
      const e1x = pos[b] - pos[a], e1y = pos[b + 1] - pos[a + 1], e1z = pos[b + 2] - pos[a + 2];
      const e2x = pos[c] - pos[a], e2y = pos[c + 1] - pos[a + 1], e2z = pos[c + 2] - pos[a + 2];
      let nx = e1y * e2z - e1z * e2y, ny = e1z * e2x - e1x * e2z, nz = e1x * e2y - e1y * e2x;
      const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
      if (len < 1e-12) continue;
      nx /= len; ny /= len; nz /= len;
      const cx = (pos[a] + pos[b] + pos[c]) / 3, cy = (pos[a + 1] + pos[b + 1] + pos[c + 1]) / 3;
      const s = 1 + rip * (0.26 * Math.sin(cy * 1.7 + t * 0.9 + cx * 0.6) + 0.15 * Math.sin(cx * 1.3 - t * 0.55));
      const vx = (pos[a] - prev[a] + pos[b] - prev[b] + pos[c] - prev[c]) * inv / 3;
      const vy = (pos[a + 1] - prev[a + 1] + pos[b + 1] - prev[b + 1] + pos[c + 1] - prev[c + 1]) * inv / 3;
      const vz = (pos[a + 2] - prev[a + 2] + pos[b + 2] - prev[b + 2] + pos[c + 2] - prev[c + 2]) * inv / 3;
      const rx = wind.x * s - vx, ry = wind.y * s - vy, rz = wind.z * s - vz;
      const fn = (nx * rx + ny * ry + nz * rz) * (len * 0.5 / A0) * AIR / 3;
      const fx = nx * fn, fy = ny * fn, fz = nz * fn;
      acc[a] += fx; acc[a + 1] += fy; acc[a + 2] += fz;
      acc[b] += fx; acc[b + 1] += fy; acc[b + 2] += fz;
      acc[c] += fx; acc[c + 1] += fy; acc[c + 2] += fz;
    }

    for (let p = 0; p < N; p++) {
      if (invMass[p] === 0) continue;
      const k = p * 3;
      const x = pos[k], y = pos[k + 1], z = pos[k + 2];
      pos[k] += (x - prev[k]) * DAMP + acc[k] * dt2;
      pos[k + 1] += (y - prev[k + 1]) * DAMP + acc[k + 1] * dt2;
      pos[k + 2] += (z - prev[k + 2]) * DAMP + acc[k + 2] * dt2;
      prev[k] = x; prev[k + 1] = y; prev[k + 2] = z;
    }

    const kx = -hang.dz, kz = hang.dx, cth = -hang.dy, fr = 1 / (1 + cth);
    for (const [p, ox, oy] of PINS) {
      const kv = kx * ox;
      pin(p,
        hang.x + ox * cth - kz * oy + kx * kv * fr,
        hang.y + oy * cth + kz * ox,
        hang.z + kx * oy + kz * kv * fr);
    }

    for (let it = 0; it < ITER; it++) {
      for (let c = 0; c < NC; c++) {
        const pa = CA[c], pb = CB[c];
        const wa = invMass[pa], wb = invMass[pb], ws = wa + wb;
        if (ws === 0) continue;
        const a = pa * 3, b = pb * 3;
        const dx = pos[b] - pos[a], dy = pos[b + 1] - pos[a + 1], dz = pos[b + 2] - pos[a + 2];
        const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (d < 1e-9) continue;
        const diff = (d - CR[c]) / (d * ws) * CK[c];
        const ax = dx * diff, ay = dy * diff, az = dz * diff;
        pos[a] += ax * wa; pos[a + 1] += ay * wa; pos[a + 2] += az * wa;
        pos[b] -= ax * wb; pos[b + 1] -= ay * wb; pos[b + 2] -= az * wb;
      }
    }

    for (let q = 0; q < PINS.length; q++) {
      const tq = TT[q], qk = PINS[q][0] * 3;
      const ax = pos[qk], ay = pos[qk + 1], az = pos[qk + 2];
      for (let p = 0; p < N; p++) {
        if (invMass[p] === 0) continue;
        const k = p * 3;
        const dx = pos[k] - ax, dy = pos[k + 1] - ay, dz = pos[k + 2] - az;
        const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (d > tq[p]) {
          const f = tq[p] / d;
          pos[k] = ax + dx * f; pos[k + 1] = ay + dy * f; pos[k + 2] = az + dz * f;
        }
      }
    }

    if (collide) selfCollide();

    const wz = WALL_Z + 0.04;
    for (let k = 2; k < N * 3; k += 3) if (pos[k] < wz) pos[k] = wz;
  }

  const dpr = Math.min(window.devicePixelRatio || 1, PHONE ? 1.6 : 1.75);
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: true,
      stencil: false,
      powerPreference: 'high-performance',
    });
  } catch (err) {
    hint.textContent = 'Your browser cannot show the 3D animation because WebGL is turned off.';
    hint.classList.remove('gone');
    fontsReady.then(reveal);
    return;
  }
  renderer.setPixelRatio(dpr);
  renderer.setClearColor(0x000000, 0);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.96;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = PHONE ? THREE.PCFSoftShadowMap : THREE.VSMShadowMap;
  renderer.shadowMap.autoUpdate = true;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
  const LOOK = new THREE.Vector3(0, 0.55, 0);
  let camDist = 16;

  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;

  Object.assign(key.shadow.camera, { left: -2.8, right: 3.2, top: 5.4, bottom: -3.6, near: 1, far: 28 });
  const fill = new THREE.DirectionalLight(0xe6edf2, 0.3);
  fill.position.set(6, 1.5, 6);
  const rim = new THREE.DirectionalLight(0xffe6c2, 0.35);
  rim.position.set(3, 5, -8);
  scene.add(hemi, key, fill, rim);

  hemi.color.set(0xfffaf0);
  hemi.groundColor.set(0xe2c36a);
  hemi.intensity = 0.4;
  key.color.set(0xffffff);
  key.intensity = 1.05;
  fill.color.set(0xfff4dc);
  fill.intensity = 0.24;
  rim.color.set(0xffffff);
  rim.intensity = 0.4;
  wallMat.opacity = 0.12;
  renderer.toneMappingExposure = 0.96;
  steel.envMapIntensity = 1.4;
  nailSteel.envMapIntensity = 1.05;

  const rtOpts = {
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,
    format: THREE.RGBAFormat,
    encoding: THREE.sRGBEncoding,
    depthBuffer: true,
    stencilBuffer: false,
  };
  const veilRT = (PHONE && renderer.capabilities.isWebGL2 && THREE.WebGLMultisampleRenderTarget)
    ? new THREE.WebGLMultisampleRenderTarget(1, 1, Object.assign({ samples: 4 }, rtOpts))
    : new THREE.WebGLRenderTarget(1, 1, rtOpts);
  veilRT.texture.generateMipmaps = false;
  veilRT.texture.flipY = false;
  const veilCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const veilMat = new THREE.ShaderMaterial({
    uniforms: {
      tDiffuse: { value: veilRT.texture },
      texel: { value: new THREE.Vector2(1, 1) },
    },
    transparent: true,
    depthTest: false,
    depthWrite: false,
    toneMapped: false,
    vertexShader: [
      'varying vec2 vUv;',
      'void main() {',
      '  vUv = uv;',
      '  gl_Position = vec4(position.xy, 0.0, 1.0);',
      '}',
    ].join('\n'),
    fragmentShader: [
      'uniform sampler2D tDiffuse;',
      'uniform vec2 texel;',
      'varying vec2 vUv;',
      'vec4 tap(vec2 uv) {',
      '  vec4 s = texture2D(tDiffuse, uv);',
      '  s.rgb *= s.a;',
      '  return s;',
      '}',
      'void main() {',
      '  vec2 px = texel;',
      '  vec4 acc = tap(vUv) * 0.20;',
      '  acc += tap(vUv + vec2(px.x, 0.0)) * 0.12;',
      '  acc += tap(vUv - vec2(px.x, 0.0)) * 0.12;',
      '  acc += tap(vUv + vec2(0.0, px.y)) * 0.12;',
      '  acc += tap(vUv - vec2(0.0, px.y)) * 0.12;',
      '  acc += tap(vUv + vec2(px.x, px.y)) * 0.08;',
      '  acc += tap(vUv + vec2(-px.x, px.y)) * 0.08;',
      '  acc += tap(vUv + vec2(px.x, -px.y)) * 0.08;',
      '  acc += tap(vUv + vec2(-px.x, -px.y)) * 0.08;',
      '  if (acc.a < 0.02) { gl_FragColor = vec4(0.0); return; }',
      '  vec3 rgb = acc.rgb / acc.a;',
      '  rgb = (rgb - 0.5) * 0.9 + 0.5;',
      '  float gray = dot(rgb, vec3(0.2126, 0.7152, 0.0722));',
      '  rgb = mix(vec3(gray), rgb, 0.92);',
      '  rgb = mix(rgb, vec3(0.980, 0.941, 0.804), 0.08);',
      '  gl_FragColor = vec4(rgb, acc.a);',
      '}',
    ].join('\n'),
  });
  const veilScene = new THREE.Scene();
  veilScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), veilMat));

  function resize() {
    const w = canvas.clientWidth || window.innerWidth, h = canvas.clientHeight || window.innerHeight;
    renderer.setSize(w, h, false);
    const pw = Math.max(1, renderer.domElement.width), ph = Math.max(1, renderer.domElement.height);
    const scale = PHONE ? 1 : ((pw * ph > 1600000) ? 1 : 2);
    veilRT.setSize(pw * scale, ph * scale);
    veilMat.uniforms.texel.value.set((PHONE ? 0.7 : 0.55) * dpr / pw, (PHONE ? 0.7 : 0.55) * dpr / ph);
    camera.aspect = w / h;
    const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    camDist = Math.max(7.0 / 2 / t, 4.6 / 2 / (t * camera.aspect));
    camera.updateProjectionMatrix();
    camera.position.set(0, 1.2, camDist);
    camera.lookAt(LOOK);
    camera.updateMatrixWorld();
  }
  window.addEventListener('resize', resize);
  resize();

  const pointer = { x: 0, y: 0, vx: 0, vy: 0, inside: false, energy: 0, lastMove: 0, lastT: 0, seen: false };
  const par = { x: 0, y: 0 };

  function toNdc(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: ((e.clientX - rect.left) / rect.width) * 2 - 1,
      y: -(((e.clientY - rect.top) / rect.height) * 2 - 1),
    };
  }
  function onMove(e) {
    if (e.pointerType !== 'mouse') return;
    const p = toNdc(e);
    const now = performance.now();
    if (pointer.inside && pointer.lastT) {
      const dt = Math.max((now - pointer.lastT) / 1000, 1 / 240);
      const ivx = (p.x - pointer.x) / dt, ivy = (p.y - pointer.y) / dt;
      pointer.vx += (Math.max(-5, Math.min(5, ivx)) - pointer.vx) * 0.4;
      pointer.vy += (Math.max(-5, Math.min(5, ivy)) - pointer.vy) * 0.4;
    }
    pointer.x = p.x; pointer.y = p.y;
    pointer.inside = true;
    pointer.lastMove = now;
    pointer.lastT = now;
    if (!pointer.seen) {
      pointer.seen = true;
      setTimeout(() => hint.classList.add('gone'), 900);
    }
  }
  function onLeave() { pointer.inside = false; pointer.lastT = 0; }

  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerdown', onMove);
  canvas.addEventListener('pointerleave', onLeave);
  canvas.addEventListener('pointercancel', onLeave);
  canvas.addEventListener('pointerup', (e) => { if (e.pointerType !== 'mouse') onLeave(); });
  window.addEventListener('blur', onLeave);

  const vp = new THREE.Matrix4();
  function pointerForces() {
    const now = performance.now();
    const moving = pointer.inside && now - pointer.lastMove < 140;
    const target = moving ? 1 : (pointer.inside ? 0.2 : 0);
    pointer.energy += (target - pointer.energy) * (target > pointer.energy ? 0.25 : 0.05);
    pointer.vx *= 0.9; pointer.vy *= 0.9;

    ext.fill(0);
    if (pointer.energy < 0.004) return;

    vp.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
    const e = vp.elements;
    const aspect = camera.aspect;
    const R2 = 0.21 * 0.21;
    const cpx = camera.position.x, cpy = camera.position.y, cpz = camera.position.z;
    const halfH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camDist;
    const halfW = halfH * aspect;
    const lim = (v) => Math.max(-9, Math.min(9, v));
    const dragX = lim(pointer.vx * halfW) * 1.8, dragY = lim(pointer.vy * halfH) * 1.15;
    const energy = pointer.energy * CALM;

    for (let p = 0; p < N; p++) {
      if (invMass[p] === 0) continue;
      const k = p * 3;
      const x = pos[k], y = pos[k + 1], z = pos[k + 2];
      const cw = e[3] * x + e[7] * y + e[11] * z + e[15];
      const sx = (e[0] * x + e[4] * y + e[8] * z + e[12]) / cw;
      const sy = (e[1] * x + e[5] * y + e[9] * z + e[13]) / cw;
      const dx = (sx - pointer.x) * aspect, dy = sy - pointer.y;
      const w = Math.exp(-(dx * dx + dy * dy) / R2) * energy;
      if (w < 0.002) continue;
      let fx = x - cpx, fy = y - cpy, fz = z - cpz;
      const l = Math.sqrt(fx * fx + fy * fy + fz * fz);
      const push = 8 * w / l;
      ext[k] = fx * push + dragX * w;
      ext[k + 1] = fy * push + dragY * w;
      ext[k + 2] = fz * push;
    }
  }

  let simTime = 0;
  let accum = 0, last = performance.now(), clock = 0, revealed = false;

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    clock += dt;

    pointerForces();

    accum += dt;
    let n = 0;
    while (accum >= SUB && n < MAX_SUB) {
      step(simTime, n === 0);
      simTime += SUB; accum -= SUB; n++;
    }
    if (accum > SUB * 4) accum = SUB * 2;

    smoothSurface();
    surfaceNormals();
    loop.position.set(hang.x, hang.y, hang.z);
    loop.quaternion.setFromUnitVectors(UP, loopDir.set(-hang.dx, -hang.dy, -hang.dz));
    posAttr.needsUpdate = true;
    normAttr.needsUpdate = true;

    renderer.setRenderTarget(veilRT);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    const prevEnc = renderer.outputEncoding;
    const prevTone = renderer.toneMapping;
    renderer.outputEncoding = THREE.LinearEncoding;
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.render(veilScene, veilCam);
    renderer.outputEncoding = prevEnc;
    renderer.toneMapping = prevTone;
    if (!revealed) { revealed = true; reveal(); }
    if (pageVisible) requestAnimationFrame(frame);
  }
  let pageVisible = true;
  document.addEventListener('visibilitychange', () => {
    pageVisible = !document.hidden;
    if (pageVisible) { last = performance.now(); requestAnimationFrame(frame); }
  });
  (function settle(left) {
    const chunk = PHONE ? 80 : 40;
    const n = Math.min(chunk, left);
    for (let i = 0; i < n; i++) { step(simTime, i === 0); simTime += SUB; }
    if (left - n > 0) requestAnimationFrame(() => settle(left - n));
    else {
      clock = simTime;
      last = performance.now();
      requestAnimationFrame(frame);
    }
  })(200);
  }

  if (typeof THREE !== 'undefined') boot();
  else {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
    s.onload = boot;
    s.onerror = () => {
      hint.textContent = 'The animation could not be loaded. Reload the page to try again.';
      hint.classList.remove('gone');
      fontsReady.then(reveal);
    };
    document.head.appendChild(s);
  }
})();
</script>
</body>
</html>
